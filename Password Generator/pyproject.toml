
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "password-generator-nk"
version = "1.0.0"
description = "A simple and secure Python password generator using the secrets module"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nilesh Kulkarni" }
]
keywords = ["password-generator", "python", "security", "password"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/YOUR_REPOSITORY"
Repository = "https://github.com/YOUR_USERNAME/YOUR_REPOSITORY"

[tool.setuptools.packages.find]
include = ["password_generator*"]
